[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getml-mlflow"
version = "0.1.0"
description = 'Integrate MLflow into getML'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "U.N. Owen", email = "void@some.where" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "pyyaml~=6.0",
  "mlflow~=2.17.0",
  "getml==1.5.0",
]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/getml_mlflow tests}"

[tool.coverage.run]
source_pkgs = ["getml_mlflow", "tests"]
branch = true
parallel = true
omit = [
  "src/getml_mlflow/__about__.py",
]

[tool.coverage.paths]
getml_mlflow = ["src/getml_mlflow", "*/getml-mlflow/src/getml_mlflow"]
tests = ["tests", "*/getml-mlflow/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = ["src/getml"]

[tool.hatch.build.targets.hatch_editable]
sources = ["src"]